<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Deep forest green background (representing Bangladesh's delta and nature) -->
  <rect width="32" height="32" rx="8" fill="#0A1C15"/>
  
  <!-- Subtle circular border for a premium emblem feel -->
  <circle cx="16" cy="16" r="14" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Waves at the bottom -->
  <path d="M8 22 C11 20.5, 13 23.5, 16 22 C19 20.5, 21 22, 24 22" stroke="#C5A85C" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Stylized Sailboat Hull -->
  <path d="M10 20 L22 20 C20.5 22, 18.5 22.5, 16 22.5 C13.5 22.5, 11.5 22, 10 20 Z" fill="#C5A85C"/>
  
  <!-- Left Sail (wind-blown, luxury champagne/off-white color) -->
  <path d="M15.2 8 C15.2 8, 11.5 13.5, 11.5 19.8 C13.5 19.8, 15.2 19.5, 15.2 19.5 L15.2 8 Z" fill="#F1E6D2"/>
  
  <!-- Right Sail (luxury gold color) -->
  <path d="M16.2 10 C16.2 10, 19.5 14.5, 19.5 19.8 C18 19.8, 16.2 19.5, 16.2 19.5 L16.2 10 Z" fill="#C5A85C"/>
  
  <!-- Guiding Star / Compass Star (representing travel, adventure, and guidance) -->
  <path d="M22 6 L22.5 8.5 L25 9 L22.5 9.5 L22 12 L21.5 9.5 L19 9 L21.5 8.5 Z" fill="#F1E6D2"/>
</svg>
